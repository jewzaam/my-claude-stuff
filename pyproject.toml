[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-claude-stuff"
version = "0.1.0"
description = "Claude Code configuration management"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Naveen Malik"}
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy==1.11.2",
    "types-psutil>=5.9",
]

# The installable surface is the guards and nothing else. `scripts/` stays
# repo-internal -- it is deployed to ~/.claude by `make reconcile`, and a
# top-level package called `scripts` in someone's site-packages is a name
# collision waiting to happen. Tests still import it: pytest puts the repo
# root on sys.path.
[tool.setuptools.packages.find]
where = ["."]
include = ["harness_guards*"]
